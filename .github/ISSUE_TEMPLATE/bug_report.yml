name: Bug report
description: Report a reproducible defect in winc.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. For security vulnerabilities, do not open a public issue. Email support@winc.si instead.
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: The part of winc where the problem appears.
      options:
        - Editor
        - Vim mode
        - Syntax highlighting / navigation
        - Formatting
        - Search
        - File tree
        - Preview
        - Git
        - Terminal
        - SSH remote / WSL
        - Interface / themes
        - Settings / shortcuts
        - Command line
        - Performance
        - Install / update
        - Other
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: The operating system where the problem occurs.
      options:
        - macOS
        - Linux
        - Windows
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Version and system information
      description: >-
        In winc, open Settings → About and click Copy, then paste the result here. If you cannot
        open winc, enter the version, system version, and architecture manually. For SSH remote or
        WSL problems, also name the system of the remote host or the distribution.
      placeholder: |
        Winc Version: 0.1.688
        Operating System: macOS 15.1
        App Architecture: aarch64
    validations:
      required: true
  - type: dropdown
    id: package
    attributes:
      label: Package
      description: How winc was installed. Needed for install and update problems.
      options:
        - macOS disk image
        - Linux AppImage
        - Linux deb
        - Arch repository
        - Windows installer (NSIS)
        - Windows installer (MSI)
        - Windows portable ZIP
        - Built from source
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Steps to reproduce, what you expected, and what happened instead.
      placeholder: |
        1.
        2.
        3.

        Expected:
        Actual:
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Screenshots or logs
      description: >-
        Optional. Drag and drop files here. Remove private data. After a crash, please attach
        crash.log from ~/Library/Application Support/winc on macOS, %LOCALAPPDATA%\winc on Windows
        (the data folder beside winc.exe for the portable ZIP), or ~/.local/state/winc on Linux
        ($XDG_STATE_HOME/winc when that variable is set).
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submit checklist
      description: Duplicate issues are closed in favor of the earlier one.
      options:
        - label: I searched existing issues and pull requests.
          required: true
        - label: I removed private code, file paths, and personal data from this report.
          required: true
        - label: This is not a security vulnerability report.
          required: false
